<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goya Boutique Resort</title>
  <meta name="description" content="Book your stay at Goya Boutique Resort — online, via WhatsApp or by email.">
  <meta name="theme-color" content="#514234">
  <!-- Century Gothic is a licensed system font; Questrial is a free look-alike used when it is not installed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #B73B29;
      --red-dark: #9a3122;
      --white: #FFFFFF;
      --brown: #514234;
      --brown-soft: rgba(81, 66, 52, .08);
      --font: "Century Gothic", CenturyGothic, "Questrial", AppleGothic, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--white);
      background: var(--brown);
      display: flex;
      justify-content: center;
      padding: 48px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 440px; text-align: center; }

    .logo {
      width: 168px;
      margin: 0 auto 22px;
      padding: 22px 24px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .45);
    }
    .logo img { display: block; width: 100%; height: auto; }

    .tagline { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
    .divider { width: 48px; height: 2px; background: var(--red); margin: 20px auto 28px; }

    .links { display: flex; flex-direction: column; gap: 14px; }
    .link {
      display: flex; align-items: center; gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 14px;
      border: 0;
      background: var(--white);
      color: var(--brown);
      font: inherit;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 10px 26px -14px rgba(0, 0, 0, .5);
      transition: transform .15s ease, background-color .15s ease;
    }
    .link:hover { transform: translateY(-2px); }
    .link:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
    .link.primary { background: var(--red); color: var(--white); }
    .link.primary:hover { background: var(--red-dark); }

    .icon {
      flex: none; width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--brown-soft);
      color: var(--red);
    }
    .link.primary .icon { background: rgba(255, 255, 255, .18); color: var(--white); }
    .icon svg { width: 22px; height: 22px; }
    .label { flex: 1; min-width: 0; }
    .label strong { display: block; font-weight: 700; font-size: 16px; }
    .label span { display: block; font-size: 13px; opacity: .8; margin-top: 3px; overflow-wrap: anywhere; }
    .arrow { flex: none; opacity: .55; transition: transform .2s ease; }
    .link[aria-expanded="true"] .arrow { transform: rotate(90deg); }

    /* Email options: Gmail first, then Outlook, then any email app */
    .email-options {
      display: grid; gap: 10px;
      margin-top: -4px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .1);
    }
    .email-options[hidden] { display: none; }
    .email-option {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--white);
      color: var(--brown);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }
    .email-option:hover { background: #f6f2ee; }
    .email-option:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
    .email-option svg { width: 22px; height: 22px; flex: none; }
    .email-option small { margin-left: auto; font-weight: 400; font-size: 12px; opacity: .65; }

    footer { margin-top: 36px; font-size: 12px; letter-spacing: .5px; opacity: .7; }
  </style>
  <!-- Vercel Web Analytics (enable Analytics in the Vercel project dashboard) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main>
    <div class="logo"><img src="logo.webp" alt="Goya Boutique Resort" width="520" height="595"></div>
    <p class="tagline">Reserve your stay</p>
    <div class="divider"></div>

    <nav class="links" aria-label="Reservation options">
      <a class="link primary" href="https://booking.goyaboutiqueresorts.com/en" target="_blank" rel="noopener">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
        </span>
        <span class="label"><strong>Book Online</strong><span>Check availability &amp; rates</span></span>
        <span class="arrow">&rarr;</span>
      </a>

      <a class="link" href="https://wa.me/6281337206868?text=Hello%20Goya%20Boutique%20Resort%2C%20I%20would%20like%20to%20make%20a%20reservation." target="_blank" rel="noopener">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 21.8h-.01a9.8 9.8 0 0 1-5-1.37l-.36-.21-3.72.98 1-3.63-.24-.37a9.8 9.8 0 0 1-1.5-5.22c0-5.42 4.41-9.83 9.84-9.83a9.77 9.77 0 0 1 9.83 9.84c0 5.42-4.41 9.83-9.84 9.83zm8.37-18.2A11.76 11.76 0 0 0 12.04.13C5.5.13.17 5.45.17 11.99c0 2.09.55 4.13 1.59 5.93L.07 24.07l6.3-1.65a11.84 11.84 0 0 0 5.67 1.44h.01c6.54 0 11.87-5.32 11.87-11.86 0-3.17-1.23-6.15-3.47-8.39z"/></svg>
        </span>
        <span class="label"><strong>Chat on WhatsApp</strong><span>+62 813-3720-6868</span></span>
        <span class="arrow">&rarr;</span>
      </a>

      <button class="link" type="button" id="email-toggle" aria-expanded="false" aria-controls="email-options">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        </span>
        <span class="label"><strong>Reserve by Email</strong><span>reservation@goyaboutiqueresorts.com</span></span>
        <span class="arrow">&rarr;</span>
      </button>

      <div class="email-options" id="email-options" hidden>
        <a class="email-option" id="opt-gmail" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22 6.5v11a1.5 1.5 0 0 1-1.5 1.5H18V9.3l-6 4.5-6-4.5V19H3.5A1.5 1.5 0 0 1 2 17.5v-11z"/><path fill="#EA4335" d="M2 6.5 12 14l10-7.5A1.5 1.5 0 0 0 19.6 5.3L12 11 4.4 5.3A1.5 1.5 0 0 0 2 6.5z"/></svg>
          Gmail <small>Recommended</small>
        </a>
        <a class="email-option" id="opt-outlook" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" fill="#0F6CBD"/><circle cx="9" cy="12" r="3.4" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M14.5 9h5M14.5 12h5M14.5 15h5" stroke="#fff" stroke-width="1.4"/></svg>
          Outlook
        </a>
        <a class="email-option" id="opt-mail" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="#514234" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          Other email app
        </a>
      </div>
    </nav>

    <footer>&copy; <span id="y">2026</span> Goya Boutique Resort</footer>
  </main>

  <script>
    (function () {
      var TO = 'reservation@goyaboutiqueresorts.com';
      var SUBJECT = 'Reservation Request';
      var BODY = 'Hello Goya Boutique Resort,\n\nI would like to make a reservation.\n\n' +
                 'Check-in date: \nCheck-out date: \nNumber of guests: \nName: \n\nThank you.';
      var e = encodeURIComponent;
      var ua = navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      var links = {
        gmailWeb: 'https://mail.google.com/mail/?view=cm&fs=1&to=' + e(TO) + '&su=' + e(SUBJECT) + '&body=' + e(BODY),
        gmailIOS: 'googlegmail:///co?to=' + e(TO) + '&subject=' + e(SUBJECT) + '&body=' + e(BODY),
        gmailAndroid: 'intent://compose?to=' + e(TO) + '&subject=' + e(SUBJECT) + '&body=' + e(BODY) +
                      '#Intent;scheme=mailto;package=com.google.android.gm;end',
        outlookWeb: 'https://outlook.live.com/mail/0/deeplink/compose?to=' + e(TO) + '&subject=' + e(SUBJECT) + '&body=' + e(BODY),
        outlookApp: 'ms-outlook://compose?to=' + e(TO) + '&subject=' + e(SUBJECT) + '&body=' + e(BODY),
        mailto: 'mailto:' + TO + '?subject=' + e(SUBJECT) + '&body=' + e(BODY)
      };

      // Try to open a mobile app; if the page is still visible shortly after, the app
      // is not installed, so fall back to the web version.
      function openApp(appUrl, fallbackUrl) {
        var left = false;
        function onHide() { if (document.hidden) left = true; }
        document.addEventListener('visibilitychange', onHide);
        window.location.href = appUrl;
        setTimeout(function () {
          document.removeEventListener('visibilitychange', onHide);
          if (!left && !document.hidden) window.location.href = fallbackUrl;
        }, 1500);
      }

      var gmail = document.getElementById('opt-gmail');
      var outlook = document.getElementById('opt-outlook');
      var mail = document.getElementById('opt-mail');
      gmail.href = links.gmailWeb;
      outlook.href = links.outlookWeb;
      mail.href = links.mailto;

      gmail.addEventListener('click', function (ev) {
        if (isIOS) { ev.preventDefault(); openApp(links.gmailIOS, links.gmailWeb); }
        else if (isAndroid) { ev.preventDefault(); openApp(links.gmailAndroid, links.gmailWeb); }
      });
      outlook.addEventListener('click', function (ev) {
        if (isIOS || isAndroid) { ev.preventDefault(); openApp(links.outlookApp, links.outlookWeb); }
      });

      var toggle = document.getElementById('email-toggle');
      var panel = document.getElementById('email-options');
      toggle.addEventListener('click', function () {
        var open = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!open));
        panel.hidden = open;
      });

      document.getElementById('y').textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
